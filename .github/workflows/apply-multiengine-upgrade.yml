name: Apply HearFlow multi-engine upgrade

on:
  push:
    branches:
      - agent/multiengine-local-cuda-remote-providers
    paths:
      - .hearflow-upgrade-bundle/TRIGGER
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .hearflow-upgrade-bundle/TRIGGER

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reassemble verified upgrade kit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $partNames = @(
            "part-000.b64",
            "part-001.b64",
            "part-002.b64",
            "part-003.b64",
            "part-004-0.b64",
            "part-004-1.b64",
            "part-004-2-0.b64",
            "part-004-2-1.b64",
            "part-004-2-2.b64",
            "part-004-2-3.b64",
            "part-004-2-4.b64",
            "part-004-2-5.b64",
            "part-004-2-6.b64",
            "part-004-3.b64",
            "part-005.b64",
            "part-006.b64",
            "part-007.b64",
            "part-008.b64",
            "part-009.b64",
            "part-010.b64",
            "part-011.b64",
            "part-012.b64",
            "part-013.b64",
            "part-014.b64"
          )
          $parts = $partNames | ForEach-Object {
            $path = Join-Path ".hearflow-upgrade-bundle" $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing upgrade bundle part: $path"
            }
            $path
          }
          if ($parts.Count -ne 24) {
            throw "Expected 24 verified upgrade bundle fragments, found $($parts.Count)."
          }
          $encoded = ($parts | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ""
          $encoded = $encoded -replace "\s", ""
          $bytes = [Convert]::FromBase64String($encoded)
          $zipPath = Join-Path $env:RUNNER_TEMP "HearFlow-Studio-multiengine-v0.2.0.zip"
          [IO.File]::WriteAllBytes($zipPath, $bytes)
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "b3c00a0d39a8df7578137a9b3237327a78678e211cd345c3c0fb530403a31bf9"
          if ($actual -ne $expected) {
            throw "Upgrade kit SHA-256 mismatch. Expected $expected, got $actual."
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "hearflow-multiengine-upgrade"
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force

      - name: Validate and apply upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $kit = Join-Path $env:RUNNER_TEMP "hearflow-multiengine-upgrade/HearFlow-Studio-upgrade-kit"
          python (Join-Path $kit "apply_upgrade.py") $env:GITHUB_WORKSPACE --check
          python (Join-Path $kit "apply_upgrade.py") $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Path "docs/multiengine" -Force | Out-Null
          Copy-Item (Join-Path $kit "docs/PROVIDER-MATRIX.md") "docs/multiengine/PROVIDER-MATRIX.md" -Force
          Copy-Item (Join-Path $kit "docs/AUDIT.md") "docs/multiengine/AUDIT.md" -Force
          Copy-Item (Join-Path $kit "docs/SECURITY.md") "docs/multiengine/SECURITY.md" -Force
          Copy-Item (Join-Path $kit "docs/TROUBLESHOOTING.md") "docs/multiengine/TROUBLESHOOTING.md" -Force

      - name: Apply backward compatibility fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          translation_path = Path("hearflow/services/translation.py")
          translation_text = translation_path.read_text(encoding="utf-8")
          translation_old = """        api_key = self._explicit_api_key
                  if api_key is None:
                      api_key = self._secret_store.load_provider_key(self.settings.credential_id)
          """
          translation_new = """        api_key = self._explicit_api_key
                  if api_key is None:
                      credential_id = self.settings.credential_id
                      if credential_id == "openai" and self.settings.provider_id != "openai":
                          credential_id = self.settings.provider_id
                      api_key = self._secret_store.load_provider_key(credential_id)
          """
          if translation_old not in translation_text:
              raise SystemExit("translation compatibility anchor not found")
          translation_path.write_text(
              translation_text.replace(translation_old, translation_new, 1),
              encoding="utf-8",
          )

          workflow_path = Path("hearflow/application/workflow.py")
          workflow_text = workflow_path.read_text(encoding="utf-8")
          workflow_old = "ffmpeg_bin=str(self.media.ffmpeg_bin),"
          workflow_new = 'ffmpeg_bin=str(getattr(self.media, "ffmpeg_bin", "ffmpeg")),'
          if workflow_old not in workflow_text:
              raise SystemExit("workflow media compatibility anchor not found")
          workflow_path.write_text(
              workflow_text.replace(workflow_old, workflow_new, 1),
              encoding="utf-8",
          )
          '@ | python -

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.8,<7" "httpx>=0.28,<1" "keyring>=25,<26" "pytest>=8,<10" "pytest-qt>=4.4,<5"

      - name: Validate generated sources and tests
        shell: pwsh
        run: |
          python -m compileall -q hearflow
          python -m pytest -q

      - name: Commit integrated source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path ".hearflow-upgrade") {
            Remove-Item ".hearflow-upgrade" -Recurse -Force
          }
          Remove-Item ".hearflow-upgrade-bundle" -Recurse -Force
          Remove-Item ".github/workflows/apply-multiengine-upgrade.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "Upgrade produced no source changes."
          }
          git commit -m "feat: add local CUDA and remote multi-provider audio engines"
          git push origin HEAD:agent/multiengine-local-cuda-remote-providers
