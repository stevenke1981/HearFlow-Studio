name: Format multi-engine source

on:
  push:
    branches:
      - agent/multiengine-local-cuda-remote-providers
    paths:
      - .github/format-multiengine-trigger

permissions:
  contents: write

jobs:
  format-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/multiengine-local-cuda-remote-providers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and lint source
        shell: pwsh
        run: |
          python -m pip install "ruff>=0.11,<1"
          ruff format hearflow tests
          ruff check hearflow tests
          ruff format --check hearflow tests

      - name: Commit formatted source and remove one-shot files
        shell: pwsh
        run: |
          Remove-Item ".github/format-multiengine-trigger" -Force
          Remove-Item ".github/workflows/format-multiengine-source.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format multi-engine source with Ruff"
          git push origin HEAD:agent/multiengine-local-cuda-remote-providers
