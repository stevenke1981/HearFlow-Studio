name: Fix multi-engine typing v2

on:
  push:
    branches:
      - agent/multiengine-local-cuda-remote-providers
    paths:
      - .github/fix-multiengine-types-v2-trigger

permissions:
  contents: write

jobs:
  fix-types:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/multiengine-local-cuda-remote-providers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply type-safety fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"expected at least {minimum} anchors in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "hearflow/services/media.py",
              "parsed = int(value)  # type: ignore[arg-type]",
              "parsed = int(value)  # type: ignore[call-overload]",
          )

          replace_once(
              "hearflow/ui/table_models.py",
              "from PySide6.QtCore import QAbstractTableModel, QModelIndex, Qt, Signal",
              "from PySide6.QtCore import (\n"
              "    QAbstractTableModel,\n"
              "    QModelIndex,\n"
              "    QPersistentModelIndex,\n"
              "    Qt,\n"
              "    Signal,\n"
              ")",
          )
          replace_once(
              "hearflow/ui/table_models.py",
              "_INVALID_INDEX = QModelIndex()",
              "_INVALID_INDEX = QModelIndex()\n_ModelIndex = QModelIndex | QPersistentModelIndex",
          )
          replace_all(
              "hearflow/ui/table_models.py",
              "parent: QModelIndex = _INVALID_INDEX",
              "parent: _ModelIndex = _INVALID_INDEX",
              minimum=4,
          )
          replace_all(
              "hearflow/ui/table_models.py",
              "index: QModelIndex",
              "index: _ModelIndex",
              minimum=4,
          )

          replace_once(
              "hearflow/ui/pages.py",
              """        for row in range(self.model.rowCount()):
                      item = self.model.segment_at(row)
                      visible = (
                          not needle
                          or needle in (item.source_text + " " + (item.translated_text or "")).casefold()
                      )
                      self.table.setRowHidden(row, not visible)
          """,
              """        for row in range(self.model.rowCount()):
                      item = self.model.segment_at(row)
                      if item is None:
                          self.table.setRowHidden(row, True)
                          continue
                      visible = (
                          not needle
                          or needle in (item.source_text + " " + (item.translated_text or "")).casefold()
                      )
                      self.table.setRowHidden(row, not visible)
          """,
          )
          replace_once("hearflow/ui/pages.py", "self.style = QComboBox()", "self.style_combo = QComboBox()")
          replace_once(
              "hearflow/ui/pages.py",
              "self.style.addItems([\"自然口語\", \"精簡字幕\", \"正式書面\", \"保留角色語氣\"])",
              "self.style_combo.addItems([\"自然口語\", \"精簡字幕\", \"正式書面\", \"保留角色語氣\"])",
          )
          replace_once(
              "hearflow/ui/pages.py",
              "form.addRow(\"翻譯風格\", self.style)",
              "form.addRow(\"翻譯風格\", self.style_combo)",
          )

          replace_once("hearflow/ui/dialogs.py", "self.style = QLineEdit(settings.translation.style)", "self.style_edit = QLineEdit(settings.translation.style)")
          replace_once(
              "hearflow/ui/dialogs.py",
              "translation_form.addRow(\"語氣風格\", self.style)",
              "translation_form.addRow(\"語氣風格\", self.style_edit)",
          )
          replace_once(
              "hearflow/ui/dialogs.py",
              "style=self.style.text().strip(),",
              "style=self.style_edit.text().strip(),",
          )

          replace_once("hearflow/ui/main_window.py", "self.style = QComboBox()", "self.style_combo = QComboBox()")
          replace_once(
              "hearflow/ui/main_window.py",
              "self.style.addItems([\"自然口語\", \"精簡字幕\", \"正式書面\", \"保留角色語氣\"])",
              "self.style_combo.addItems([\"自然口語\", \"精簡字幕\", \"正式書面\", \"保留角色語氣\"])",
          )
          replace_once(
              "hearflow/ui/main_window.py",
              "layout.addWidget(self.style, 2, 1, 1, 2)",
              "layout.addWidget(self.style_combo, 2, 1, 1, 2)",
          )
          replace_once(
              "hearflow/ui/main_window.py",
              "translation_style=self.project_settings.style.currentText(),",
              "translation_style=self.project_settings.style_combo.currentText(),",
          )

          replace_once(
              "hearflow/services/settings.py",
              "from typing import Any, Protocol",
              "from typing import Any, Protocol, cast",
          )
          replace_once(
              "hearflow/services/settings.py",
              "allowed = {item.name for item in fields(cls)}",
              "allowed = {item.name for item in fields(cast(Any, cls))}",
          )

          replace_once(
              "hearflow/services/gateway.py",
              """def run_async[T](awaitable: Awaitable[T]) -> T:
                  \"\"\"Run an async service method from a Qt worker, even near an active loop.\"\"\"

                  try:
                      asyncio.get_running_loop()
                  except RuntimeError:
                      return asyncio.run(awaitable)

                  result: list[T] = []
                  error: list[BaseException] = []

                  def runner() -> None:
                      try:
                          result.append(asyncio.run(awaitable))
                      except BaseException as exc:  # propagate the original service exception
                          error.append(exc)
          """,
              """def run_async[T](awaitable: Awaitable[T]) -> T:
                  \"\"\"Run an async service method from a Qt worker, even near an active loop.\"\"\"

                  async def consume() -> T:
                      return await awaitable

                  try:
                      asyncio.get_running_loop()
                  except RuntimeError:
                      return asyncio.run(consume())

                  result: list[T] = []
                  error: list[BaseException] = []

                  def runner() -> None:
                      try:
                          result.append(asyncio.run(consume()))
                      except BaseException as exc:  # propagate the original service exception
                          error.append(exc)
          """,
          )

          replace_once(
              "hearflow/services/local_tts.py",
              """        for candidate in candidates:
                      resolved = candidate.resolve(strict=False)
                      if resolved.is_file():
                          return resolved
          """,
              """        for candidate in candidates:
                      resolved_path = candidate.resolve(strict=False)
                      if resolved_path.is_file():
                          return resolved_path
          """,
          )

          replace_once(
              "hearflow/application/workflow.py",
              "from typing import Any",
              "from typing import Any, Protocol",
          )
          replace_once(
              "hearflow/application/workflow.py",
              "    ExportOptions,\n    JobStatus,",
              "    EngineStatus,\n    ExportOptions,\n    JobStatus,",
          )
          replace_once(
              "hearflow/application/workflow.py",
              "    QwenGatewayClient,\n",
              "",
          )
          replace_once(
              "hearflow/application/workflow.py",
              """ALLOWED_EXPORT_FORMATS = frozenset({"srt", "vtt", "ass", "txt", "json"})


          class WorkflowError(RuntimeError):
          """,
              """ALLOWED_EXPORT_FORMATS = frozenset({"srt", "vtt", "ass", "txt", "json"})


          class TranscriptionClient(Protocol):
              \"\"\"Common local or remote transcription service boundary.\"\"\"

              def health(self) -> EngineStatus: ...

              def transcribe(
                  self,
                  media_path: str | Path,
                  options: TranscriptionOptions | None = None,
                  cancellation: CancellationToken | None = None,
              ) -> AsrResult: ...


          class WorkflowError(RuntimeError):
          """,
          )
          replace_once(
              "hearflow/application/workflow.py",
              "gateway: QwenGatewayClient,",
              "gateway: TranscriptionClient,",
          )
          replace_once(
              "hearflow/application/workflow.py",
              "self.gateway = gateway",
              "self.gateway: TranscriptionClient = gateway",
          )
          '@ | python -

      - name: Install project and validation tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate all quality gates
        shell: pwsh
        run: |
          ruff check --fix hearflow tests
          ruff format hearflow tests
          ruff check hearflow tests
          ruff format --check hearflow tests
          mypy hearflow
          pytest tests/ -ra --tb=short

      - name: Commit fixes and remove one-shot files
        shell: pwsh
        run: |
          Remove-Item ".github/fix-multiengine-types-trigger" -Force
          Remove-Item ".github/workflows/fix-multiengine-types.yml" -Force
          Remove-Item ".github/fix-multiengine-types-v2-trigger" -Force
          Remove-Item ".github/workflows/fix-multiengine-types-v2.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy multi-engine typing and compatibility gates"
          git push origin HEAD:agent/multiengine-local-cuda-remote-providers
