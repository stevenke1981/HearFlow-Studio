name: Fix multi-engine import order

on:
  push:
    branches:
      - agent/multiengine-local-cuda-remote-providers
    paths:
      - .github/import-order-trigger

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/multiengine-local-cuda-remote-providers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix import order
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("hearflow/ui/main_window.py")
          text = path.read_text(encoding="utf-8")
          old = """from hearflow.ui.dialogs import EnvironmentReportDialog, NewProjectDialog
          from hearflow.ui.settings_v2 import SettingsDialog
          from hearflow.ui.pages import (
              EditorPage,
              FilesPage,
              QueuePage,
              ReportsPage,
              TimelinePage,
              TranslationPage,
              WorkflowPage,
          )
          from hearflow.ui.table_models import JobTableModel, SegmentTableModel
          """
          new = """from hearflow.ui.dialogs import EnvironmentReportDialog, NewProjectDialog
          from hearflow.ui.pages import (
              EditorPage,
              FilesPage,
              QueuePage,
              ReportsPage,
              TimelinePage,
              TranslationPage,
              WorkflowPage,
          )
          from hearflow.ui.settings_v2 import SettingsDialog
          from hearflow.ui.table_models import JobTableModel, SegmentTableModel
          """
          if old not in text:
              raise SystemExit("main_window import-order anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -

      - name: Verify Ruff import rule
        shell: pwsh
        run: |
          python -m pip install "ruff>=0.11,<1"
          ruff check hearflow/ui/main_window.py

      - name: Commit source fix and remove one-shot files
        shell: pwsh
        run: |
          Remove-Item ".github/import-order-trigger" -Force
          Remove-Item ".github/workflows/fix-multiengine-import-order.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: organize multi-engine UI imports"
          git push origin HEAD:agent/multiengine-local-cuda-remote-providers
